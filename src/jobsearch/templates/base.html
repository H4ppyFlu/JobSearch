<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}JobSearch{% endblock %}</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e2e2dd;
    --accent: #2f5d8a; --good: #2e7d4f; --warn: #a15c00; --new: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --card: #20201e; --text: #ececea; --muted: #a0a09a; --line: #34342f;
      --accent: #8ab4e0; --good: #6cc495; --warn: #e0a85a; --new: #ff7b6b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--card); }
  header a { color: var(--text); text-decoration: none; font-weight: 600; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  a { color: var(--accent); }
  table { width: 100%; border-collapse: collapse; background: var(--card); }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 13px; color: var(--muted); font-weight: 600; }
  .muted { color: var(--muted); }
  .tier { white-space: nowrap; color: var(--warn); }
  .badge { display: inline-block; font-size: 12px; padding: 0 6px; border-radius: 4px;
           border: 1px solid var(--line); color: var(--muted); margin-left: 4px; white-space: nowrap; }
  .badge.new { border-color: var(--new); color: var(--new); }
  .badge.target { border-color: var(--good); color: var(--good); }
  form.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin-bottom: 12px; }
  form.filters label { display: flex; flex-direction: column; font-size: 13px; color: var(--muted); }
  select, input, textarea, button { font: inherit; color: var(--text); background: var(--card);
                                    border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: var(--card); border-color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 12px 16px; margin-bottom: 12px; }
  .description { white-space: pre-wrap; max-height: 32em; overflow: auto; }
  @media (max-width: 700px) { .hide-small { display: none; } }
</style>
</head>
<body>
<header><a href="{{ url_for('jobs') }}">JobSearch</a>
  <a href="{{ url_for('report_page') }}" style="font-weight:normal;margin-left:16px">Wochenbericht</a></header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
