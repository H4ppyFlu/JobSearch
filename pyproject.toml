[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobsearch"
version = "0.1.0"
description = "Daily job discovery: collects postings, merges duplicates into jobs and scores them against a candidate profile."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jobsearch = "jobsearch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobsearch = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
